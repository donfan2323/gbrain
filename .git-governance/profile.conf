# git-governance: repo-specific profile, sourced by .githooks/*.
#
# This is the Universal Git Governance layer's first cross-repo rollout
# (originally implemented for /Users/lab/.hermes/hermes-agent). The hook
# logic in .githooks/ is repo-agnostic; only this file's values differ
# between repos. Keep it small — this is deliberately not a general
# plugin system, just the handful of values that actually vary.

# Upstream remote: third-party official project this repo tracks.
# Read-only in practice (we don't have push access), and its push URL is
# additionally disabled locally as a second, independent layer.
UPSTREAM_REMOTE=origin
UPSTREAM_IS_THIRDPARTY=true

# Writable remote: personal fork, used for all local backups/pushes.
WRITABLE_REMOTE=fork

# Branches .githooks/reference-transaction and .githooks/pre-push treat as
# protected — non-fast-forward moves/deletions require the old tip to
# already be reachable elsewhere, and force-pushes are refused outright.
# Extended-glob-free, matched with a plain `case` pattern in the hooks:
# list each pattern on its own line-equivalent via the | separator used
# there. Unlike Hermes, this repo has no production/* or integration/*
# convention (its production runtime doesn't reference this working tree
# at all — see docs/GIT_GOVERNANCE.md) — protected here is simply the
# branch this repo already treats as primary, plus any rescue/* backup.
PROTECTED_BRANCH_GLOBS="refs/heads/master refs/heads/rescue/*"

# Primary branch, for documentation/tooling that needs to name it once.
PRIMARY_BRANCH=master
